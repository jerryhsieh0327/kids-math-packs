<script>window.QUIZ={"date": "2026-11-04", "child": "Seren", "topic": "Lesson 27 Work Rate + syllabus review (求时间／剩余／算式对应／未知因数／方位)", "level": 5, "questions": [{"title": "求时间", "level": 5, "topic": "work rate", "isReview": false, "q": "小明每小时做 248 个零件，做完 4464 个零件要几小时？", "options": {"A": "16 小时", "B": "18 小时", "C": "20 小时", "D": "24 小时"}, "answer": "B", "explanation": "时间 = 工作量 ÷ 效率：4464 ÷ 248。可以想 248 × 18 = 248 × 20 − 248 × 2 = 4960 − 496 = 4464。所以要 18 小时。", "wrong": {"A": "16 偏小。248 × 16 = 3968，还不到 4464。正确是 18 小时。", "C": "20 偏大。248 × 20 = 4960，超过 4464。正确：4464 ÷ 248 = 18。", "D": "24 太大。248 × 24 = 5952。验算：248 × 18 = 4464。"}, "mistakes": "估商偏大或偏小；用加减代替除法。"}, {"title": "Remaining work", "level": 5, "topic": "work rate", "isReview": false, "q": "There are 7560 leaflets to fold. Chloe folds 315 leaflets per hour. After she works for 8 hours, how many leaflets are left?", "options": {"A": "5040 leaflets", "B": "2520 leaflets", "C": "4725 leaflets", "D": "6300 leaflets"}, "answer": "A", "explanation": "Done in 8 hours: 315 × 8 = 2520. Remaining: 7560 − 2520 = 5040 leaflets.", "wrong": {"B": "2520 is how many she already folded, not what is left. Subtract from 7560: 5040 left.", "C": "4725 may come from 315 × 15 or another mix-up. Use 315 × 8 = 2520, then 7560 − 2520 = 5040.", "D": "6300 is 7560 − 1260 (as if only 4 hours). She worked 8 hours: done 2520, left 5040."}, "mistakes": "Reporting the done amount instead of remaining; using the wrong number of hours."}, {"title": "算式对应问题", "level": 5, "topic": "work rate", "isReview": false, "q": "算式 (5400 − 2160) ÷ (2160 ÷ 6) 可以解答下面哪个问题？", "options": {"A": "王阿姨 6 天缝了 2160 件衣服。照这样的速度，缝完一共 5400 件还要几天？", "B": "王阿姨每天缝 2160 件，6 天一共缝多少件？", "C": "一共有 5400 件衣服，6 天缝完，平均每天缝多少件？", "D": "王阿姨 6 天缝了 2160 件。照这样的速度，缝 5400 件一共要几天？"}, "answer": "A", "explanation": "先算效率：2160 ÷ 6 = 360（件/天）。已缝 2160，还剩 5400 − 2160 = 3240。剩余天数：3240 ÷ 360 = 9。所以算式求的是「缝完一共 5400 件还要几天」。D 问的是一共几天，对应的是 5400 ÷ (2160 ÷ 6)，没有减已缝的部分。", "wrong": {"B": "那是 2160 × 6，和这个算式无关。", "C": "那是 5400 ÷ 6，不是 (5400 − 2160) ÷ (2160 ÷ 6)。", "D": "D 求的是总天数 5400 ÷ 360 = 15，算式应是 5400 ÷ (2160 ÷ 6)。本题先减已缝再除，求的是还要几天。"}, "mistakes": "把「还要几天」和「一共几天」搞混；忽略括号里先求效率。"}, {"title": "Missing factor", "level": 5, "topic": "missing factor", "isReview": true, "q": "What number belongs in the box? □ × 28 = 5096", "options": {"A": "172", "B": "182", "C": "192", "D": "162"}, "answer": "B", "explanation": "□ = 5096 ÷ 28. Try 28 × 180 = 5040. 5096 − 5040 = 56, and 56 ÷ 28 = 2, so □ = 182. Check: 28 × 182 = 5096.", "wrong": {"A": "172 is too small: 28 × 172 = 4816, short of 5096. Keep adjusting the quotient upward to 182.", "C": "192 is too big: 28 × 192 = 5376. 5096 − 5040 = 56 more after 180, which is only +2 → 182.", "D": "162 is too small: 28 × 162 = 4536. Estimate near 180 first, then fine-tune."}, "mistakes": "Guessing a quotient that is a little too low (as on an earlier miss); forgetting to check with multiplication."}, {"title": "方位", "level": 5, "topic": "directions", "isReview": true, "q": "公园在学校的北面。图书馆在公园的东面。图书馆在学校的哪一个方位？", "options": {"A": "东北", "B": "西北", "C": "东南", "D": "正北"}, "answer": "A", "explanation": "先从学校往北到公园，再从公园往东到图书馆。北再偏东，合起来是东北方向。", "wrong": {"B": "西北是北再偏西。题目是公园在北、图书馆在公园东面，应是东北。", "C": "东南是南再偏东。第一步是往北，不是往南。", "D": "正北只到公园。图书馆还在公园东面，所以相对学校是东北。"}, "mistakes": "只看第一步方位；把东、西搞反。"}, {"title": "Plan vs actual", "level": 5, "topic": "work rate", "isReview": false, "challenge": true, "q": "A factory planned to make 9600 toys in 15 days (same number each day). They finished all 9600 toys in 12 days. How many more toys did they make per day than planned?", "options": {"A": "160 toys", "B": "200 toys", "C": "240 toys", "D": "80 toys"}, "answer": "A", "explanation": "Planned daily rate: 9600 ÷ 15 = 640 toys/day. Actual daily rate: 9600 ÷ 12 = 800 toys/day. Difference: 800 − 640 = 160 toys more per day.", "wrong": {"B": "200 is 9600 ÷ 48 or another mix-up. Use 800 − 640 = 160.", "C": "240 is 9600 ÷ 40. Planned is 640, actual is 800; difference is 160.", "D": "80 is half of 160 (maybe averaging days wrong). Full difference is 800 − 640 = 160."}, "mistakes": "Comparing totals instead of daily rates; subtracting days (15−12) instead of rates."}]};</script><script src="../assets/quiz.js?v=4"></script></body></html>
